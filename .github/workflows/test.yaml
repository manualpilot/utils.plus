name: test
on:
  push:
    branches-ignore:
      - main
  workflow_call:
    inputs:
      pages:
        description: Hand dist to the calling workflow as the Pages artifact.
        type: boolean
        default: false
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-node@main
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - run: npm run outdated
      - run: npm run build
      - run: npm test
      - uses: actions/upload-pages-artifact@main
        if: inputs.pages
        with:
          path: dist
