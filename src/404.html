<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./images/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#121212" />
  <meta name="darkreader-lock" />
  <meta name="robots" content="noindex" />
  <title>Page Not Found · utils+</title>
  <style>
    :root {
      color-scheme: dark;
    }

    html,
    body {
      margin: 0;
      background-color: #121212;
      color: #E0E0E0;
    }

    body {
      box-sizing: border-box;
      display: grid;
      min-height: 100vh;
      padding: 2rem 1rem;
      place-items: center;
      font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main {
      max-width: 62.5rem;
      text-align: center;
    }

    h1 {
      margin: 0;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 0.5rem;
    }

    p {
      margin: 1.5rem 0 0;
      color: #909296;
    }

    a {
      color: #FF7043;
    }

    a:hover {
      color: #FF5722;
    }
  </style>
</head>

<body>
  <main>
    <h1><img src="./images/not-found.png" width="1000" height="600" alt="404: Page Not Found" /></h1>
